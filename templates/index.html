<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClashX24 Brute Force Tool</title>
    <style>
        /* ... (keep all existing styles) ... */
        
        .resume-badge {
            background: #f6ad55;
            color: #744210;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-left: 10px;
        }
        
        .saved-state-notice {
            background: #feebc8;
            border: 1px solid #f6ad55;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
        }
        
        .saved-state-notice.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 ClashX24 Brute Force Tool</h1>
            <p>Automated OTP brute force with persistent state</p>
        </div>
        
        <div class="main-content">
            <!-- Saved State Notice -->
            <div id="savedStateNotice" class="saved-state-notice">
                <strong>💾 Saved State Found!</strong><br>
                <span id="savedStateInfo">Previous session was running. You can resume or start fresh.</span>
                <div style="margin-top: 10px;">
                    <button class="btn btn-success" id="resumeBtn" style="flex: 0 0 auto; padding: 8px 20px;">🔄 Resume</button>
                    <button class="btn btn-danger" id="clearStateBtn" style="flex: 0 0 auto; padding: 8px 20px;">🗑️ Clear State</button>
                </div>
            </div>
            
            <div class="input-section">
                <div class="input-group">
                    <label>📱 Phone Number</label>
                    <input type="text" id="phoneNumber" placeholder="Enter 10-digit phone number" maxlength="10">
                </div>
                <div class="input-group">
                    <label>⚡ Workers</label>
                    <input type="number" id="maxWorkers" value="10" min="1" max="50">
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" id="sendOtpBtn">📤 Send OTP</button>
                <button class="btn btn-success" id="startBruteforceBtn">🚀 Start Brute Force</button>
                <button class="btn btn-danger" id="stopBruteforceBtn" disabled>⏹️ Stop</button>
                <button class="btn btn-warning" id="clearLogsBtn">🗑️ Clear Logs</button>
            </div>
            
            <div id="statusMessage" style="margin: 15px 0; padding: 10px; border-radius: 10px; display: none;"></div>
            
            <div class="stats-grid">
                <div class="stat-card info">
                    <div class="value" id="statusBadge">Idle</div>
                    <div class="label">Status</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="attemptsCount">0</div>
                    <div class="label">Attempts</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="progressPercent">0%</div>
                    <div class="label">Progress</div>
                </div>
                <div class="stat-card success">
                    <div class="value" id="speedCount">0</div>
                    <div class="label">OTP/s</div>
                </div>
                <div class="stat-card warning">
                    <div class="value" id="timeElapsed">0s</div>
                    <div class="label">Elapsed Time</div>
                </div>
                <div class="stat-card success">
                    <div class="value" id="foundOtp">-</div>
                    <div class="label">Found OTP</div>
                </div>
                <div class="stat-card info">
                    <div class="value" id="lastOtpTried">-</div>
                    <div class="label">Last OTP Tried</div>
                </div>
            </div>
            
            <div class="progress-bar">
                <div class="fill" id="progressFill"></div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
                <h3 style="color: #2d3748;">📋 Live Logs</h3>
                <div>
                    <span id="logCount" style="color: #718096; margin-right: 15px;">0 entries</span>
                    <span id="stateIndicator" style="color: #718096; font-size: 12px;"></span>
                </div>
            </div>
            <div class="logs-container" id="logsContainer">
                <div class="log-entry info">
                    <span class="timestamp">System</span>
                    <span class="message">Waiting to start...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let statusInterval = null;
        let isInitialLoad = true;
        
        function showMessage(message, type = 'info') {
            const msgDiv = document.getElementById('statusMessage');
            msgDiv.style.display = 'block';
            msgDiv.textContent = message;
            msgDiv.style.background = type === 'success' ? '#c6f6d5' : 
                                     type === 'error' ? '#fed7d7' : 
                                     type === 'warning' ? '#feebc8' : '#bee3f8';
            msgDiv.style.color = type === 'success' ? '#22543d' : 
                                type === 'error' ? '#9b2c2c' : 
                                type === 'warning' ? '#744210' : '#2a4365';
            
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }
        
        function updateStatus(data) {
            document.getElementById('attemptsCount').textContent = data.total_attempts || 0;
            document.getElementById('progressPercent').textContent = data.progress_percentage ? data.progress_percentage.toFixed(2) + '%' : '0%';
            document.getElementById('progressFill').style.width = data.progress_percentage ? data.progress_percentage + '%' : '0%';
            document.getElementById('speedCount').textContent = data.speed ? data.speed.toFixed(1) : '0';
            document.getElementById('timeElapsed').textContent = data.elapsed_time ? Math.floor(data.elapsed_time) + 's' : '0s';
            document.getElementById('foundOtp').textContent = data.found_otp || '-';
            document.getElementById('lastOtpTried').textContent = data.last_otp_tried || '-';
            
            // Update state indicator
            const stateIndicator = document.getElementById('stateIndicator');
            if (data.has_saved_state) {
                stateIndicator.textContent = '💾 State saved';
                stateIndicator.style.color = '#f6ad55';
            } else {
                stateIndicator.textContent = '';
            }
            
            // Show saved state notice
            const savedNotice = document.getElementById('savedStateNotice');
            if (data.has_saved_state && !data.is_running && !data.completed && !data.found_otp) {
                savedNotice.classList.add('show');
                document.getElementById('savedStateInfo').textContent = 
                    `Phone: ${data.phone_number || 'Unknown'} | Attempts: ${data.total_attempts} | Last OTP: ${data.last_otp_tried || 'None'}`;
            } else {
                savedNotice.classList.remove('show');
            }
            
            const statusBadge = document.getElementById('statusBadge');
            if (data.is_running) {
                statusBadge.textContent = '🔴 Running';
                statusBadge.style.color = '#48bb78';
            } else if (data.found_otp) {
                statusBadge.textContent = '✅ Completed';
                statusBadge.style.color = '#48bb78';
            } else if (data.has_saved_state) {
                statusBadge.textContent = '💾 Saved';
                statusBadge.style.color = '#f6ad55';
            } else {
                statusBadge.textContent = '⏸️ Idle';
                statusBadge.style.color = '#a0aec0';
            }
            
            // Update button states
            document.getElementById('startBruteforceBtn').disabled = data.is_running;
            document.getElementById('stopBruteforceBtn').disabled = !data.is_running;
            
            // Update phone number if saved
            if (data.phone_number && isInitialLoad) {
                document.getElementById('phoneNumber').value = data.phone_number;
                isInitialLoad = false;
            }
        }
        
        function fetchStatus() {
            fetch('/status')
                .then(res => res.json())
                .then(data => updateStatus(data))
                .catch(err => console.error('Error fetching status:', err));
        }
        
        function setupLogStream() {
            if (eventSource) {
                eventSource.close();
            }
            
            eventSource = new EventSource('/stream-logs');
            
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'heartbeat') return;
                
                addLogToUI(data);
            };
            
            eventSource.onerror = function() {
                console.error('EventSource failed, reconnecting...');
                setTimeout(setupLogStream, 5000);
            };
        }
        
        function addLogToUI(log) {
            const container = document.getElementById('logsContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${log.status || 'info'}`;
            entry.innerHTML = `
                <span class="timestamp">${log.timestamp || 'System'}</span>
                <span class="message">${log.message}</span>
            `;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            // Update log count
            document.getElementById('logCount').textContent = container.children.length + ' entries';
        }
        
        // Resume button
        document.getElementById('resumeBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const maxWorkers = parseInt(document.getElementById('maxWorkers').value) || 10;
            
            if (!phoneNumber) {
                showMessage('Please enter phone number', 'error');
                return;
            }
            
            document.getElementById('savedStateNotice').classList.remove('show');
            
            fetch('/start-bruteforce', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phone_number: phoneNumber,
                    max_workers: maxWorkers,
                    resume: true
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage(`🔄 Resuming from OTP ${data.start_from || 0}...`, 'success');
                } else {
                    showMessage('❌ Failed to resume: ' + data.message, 'error');
                }
            })
            .catch(err => {
                showMessage('❌ Error: ' + err.message, 'error');
            });
        });
        
        // Clear state button
        document.getElementById('clearStateBtn').addEventListener('click', function() {
            if (!confirm('Are you sure you want to clear the saved state? This will reset all progress.')) return;
            
            fetch('/reset-state', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('savedStateNotice').classList.remove('show');
                    showMessage('🗑️ State cleared successfully', 'success');
                    fetchStatus();
                }
            })
            .catch(err => {
                showMessage('❌ Error: ' + err.message, 'error');
            });
        });
        
        // Send OTP button
        document.getElementById('sendOtpBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            
            if (!phoneNumber || phoneNumber.length !== 10 || !/^\d+$/.test(phoneNumber)) {
                showMessage('Please enter a valid 10-digit phone number', 'error');
                return;
            }
            
            this.disabled = true;
            this.textContent = 'Sending...';
            
            fetch('/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone_number: phoneNumber})
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('✅ OTP sent successfully! You can start brute force now.', 'success');
                } else {
                    showMessage('❌ Failed to send OTP: ' + data.message, 'error');
                }
            })
            .catch(err => {
                showMessage('❌ Error: ' + err.message, 'error');
            })
            .finally(() => {
                this.disabled = false;
                this.textContent = '📤 Send OTP';
            });
        });
        
        // Start brute force button
        document.getElementById('startBruteforceBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const maxWorkers = parseInt(document.getElementById('maxWorkers').value) || 10;
            
            if (!phoneNumber || phoneNumber.length !== 10 || !/^\d+$/.test(phoneNumber)) {
                showMessage('Please enter a valid 10-digit phone number', 'error');
                return;
            }
            
            this.disabled = true;
            this.textContent = 'Starting...';
            
            fetch('/start-bruteforce', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phone_number: phoneNumber,
                    max_workers: maxWorkers,
                    resume: false
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('✅ Brute force started! Monitoring progress...', 'success');
                } else {
                    showMessage('❌ Failed to start: ' + data.message, 'error');
                }
            })
            .catch(err => {
                showMessage('❌ Error: ' + err.message, 'error');
            })
            .finally(() => {
                this.disabled = false;
                this.textContent = '🚀 Start Brute Force';
            });
        });
        
        // Stop brute force button
        document.getElementById('stopBruteforceBtn').addEventListener('click', function() {
            if (!confirm('Are you sure you want to stop the brute force?')) return;
            
            this.disabled = true;
            this.textContent = 'Stopping...';
            
            fetch('/stop-bruteforce', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('⏹️ Stop signal sent. Waiting for graceful shutdown...', 'warning');
                }
            })
            .catch(err => {
                showMessage('❌ Error: ' + err.message, 'error');
            })
            .finally(() => {
                this.disabled = false;
                this.textContent = '⏹️ Stop';
            });
        });
        
        // Clear logs button
        document.getElementById('clearLogsBtn').addEventListener('click', function() {
            const container = document.getElementById('logsContainer');
            container.innerHTML = '';
            document.getElementById('logCount').textContent = '0 entries';
            showMessage('🗑️ Logs cleared', 'info');
        });
        
        // Initialize
        setupLogStream();
        statusInterval = setInterval(fetchStatus, 2000);
        fetchStatus();
        
        // Allow Enter key on phone number input
        document.getElementById('phoneNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('sendOtpBtn').click();
            }
        });
    </script>
</body>
</html>
