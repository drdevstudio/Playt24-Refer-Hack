<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔓 ClashX24 - Brute Force Terminal</title>
    <style>
        /* ===== HACKER THEME CSS ===== */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 20px;
            color: #00ff41;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(0, 255, 65, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(0, 255, 65, 0.05) 0%, transparent 50%);
        }
        
        /* Matrix rain effect background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, 
                    transparent, 
                    transparent 2px,
                    rgba(0, 255, 65, 0.01) 2px,
                    rgba(0, 255, 65, 0.01) 4px
                );
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ff41;
            border-radius: 8px;
            box-shadow: 
                0 0 30px rgba(0, 255, 65, 0.1),
                inset 0 0 30px rgba(0, 255, 65, 0.05);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        
        /* Scanning line effect */
        .container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff41, transparent);
            animation: scanline 4s linear infinite;
            opacity: 0.3;
            pointer-events: none;
        }
        
        @keyframes scanline {
            0% { top: 0; opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { top: 100%; opacity: 0.3; }
        }
        
        .header {
            background: linear-gradient(180deg, rgba(0, 255, 65, 0.1) 0%, transparent 100%);
            padding: 30px 40px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.3);
            position: relative;
        }
        
        .header::before {
            content: '>';
            position: absolute;
            left: 20px;
            top: 35px;
            font-size: 24px;
            color: #00ff41;
            opacity: 0.5;
        }
        
        .header h1 {
            font-size: 2.8em;
            font-weight: normal;
            color: #00ff41;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            letter-spacing: 3px;
            margin-left: 30px;
        }
        
        .header h1 .blink {
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .header .subtitle {
            color: #00cc33;
            opacity: 0.7;
            font-size: 0.9em;
            margin-left: 30px;
            letter-spacing: 5px;
        }
        
        .header .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }
        
        .header .status-dot.online {
            background: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        
        .main-content {
            padding: 30px 40px;
        }
        
        /* ===== Input Section ===== */
        .input-section {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(0, 255, 65, 0.03);
            padding: 20px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 65, 0.15);
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .input-group label {
            color: #00cc33;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
        }
        
        .input-group label .prompt {
            color: #00ff41;
            opacity: 1;
        }
        
        .input-group input {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
            padding: 12px 15px;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }
        
        .input-group input:focus {
            border-color: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            background: rgba(0, 255, 65, 0.05);
        }
        
        .input-group input::placeholder {
            color: rgba(0, 255, 65, 0.2);
        }
        
        /* ===== Buttons ===== */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr 0.5fr 0.5fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 12px 20px;
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            font-weight: normal;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            border-color: #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
            transform: translateY(-1px);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-primary {
            border-color: rgba(0, 100, 255, 0.5);
            color: #4a9eff;
        }
        
        .btn-primary:hover {
            border-color: #4a9eff;
            box-shadow: 0 0 30px rgba(0, 100, 255, 0.1);
        }
        
        .btn-success {
            border-color: rgba(0, 255, 65, 0.5);
            color: #00ff41;
        }
        
        .btn-success:hover {
            border-color: #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }
        
        .btn-danger {
            border-color: rgba(255, 0, 0, 0.5);
            color: #ff4444;
        }
        
        .btn-danger:hover {
            border-color: #ff4444;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }
        
        .btn-warning {
            border-color: rgba(255, 200, 0, 0.5);
            color: #ffcc00;
        }
        
        .btn-warning:hover {
            border-color: #ffcc00;
            box-shadow: 0 0 30px rgba(255, 200, 0, 0.2);
        }
        
        /* ===== Status Message ===== */
        .status-message {
            padding: 12px 20px;
            border-radius: 4px;
            margin: 15px 0;
            display: none;
            font-size: 14px;
            border-left: 3px solid;
        }
        
        .status-message.show {
            display: block;
        }
        
        .status-message.success {
            background: rgba(0, 255, 65, 0.05);
            border-color: #00ff41;
            color: #00ff41;
        }
        
        .status-message.error {
            background: rgba(255, 0, 0, 0.05);
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .status-message.warning {
            background: rgba(255, 200, 0, 0.05);
            border-color: #ffcc00;
            color: #ffcc00;
        }
        
        .status-message.info {
            background: rgba(0, 100, 255, 0.05);
            border-color: #4a9eff;
            color: #4a9eff;
        }
        
        /* ===== Stats Grid ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 65, 0.1);
            border-radius: 4px;
            padding: 15px 20px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            border-color: rgba(0, 255, 65, 0.3);
        }
        
        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #00ff41;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }
        
        .stat-card .label {
            font-size: 10px;
            color: rgba(0, 255, 65, 0.5);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .stat-card.success .value { color: #00ff41; }
        .stat-card.danger .value { color: #ff4444; }
        .stat-card.warning .value { color: #ffcc00; }
        .stat-card.info .value { color: #4a9eff; }
        .stat-card.purple .value { color: #9b59b6; }
        
        .stat-card .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        
        .stat-card .status-badge.running {
            background: rgba(0, 255, 65, 0.2);
            color: #00ff41;
            animation: pulse 1s infinite;
        }
        
        .stat-card .status-badge.idle {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
        }
        
        .stat-card .status-badge.found {
            background: rgba(0, 255, 65, 0.3);
            color: #00ff41;
        }
        
        .stat-card .status-badge.saved {
            background: rgba(255, 200, 0, 0.2);
            color: #ffcc00;
            animation: pulse 2s infinite;
        }
        
        /* ===== Progress Bar ===== */
        .progress-container {
            margin: 15px 0 20px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(0, 255, 65, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff41, #00cc33);
            transition: width 0.5s;
            width: 0%;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }
        
        .progress-bar .glow {
            position: absolute;
            top: -2px;
            right: 0;
            width: 100px;
            height: 8px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.3));
            filter: blur(4px);
        }
        
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
            color: rgba(0, 255, 65, 0.4);
            letter-spacing: 1px;
        }
        
        /* ===== Logs Container ===== */
        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 12px 0;
        }
        
        .logs-header h3 {
            color: #00ff41;
            font-weight: normal;
            font-size: 1.1em;
            letter-spacing: 2px;
        }
        
        .logs-header .log-meta {
            color: rgba(0, 255, 65, 0.3);
            font-size: 11px;
            letter-spacing: 1px;
        }
        
        .logs-container {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 255, 65, 0.1);
            border-radius: 4px;
            padding: 15px 20px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
        }
        
        .logs-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .logs-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3px;
        }
        
        .logs-container::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.3);
            border-radius: 3px;
        }
        
        .logs-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.5);
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(0, 255, 65, 0.03);
            display: flex;
            gap: 15px;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .log-entry .timestamp {
            color: rgba(0, 255, 65, 0.3);
            min-width: 70px;
            font-size: 11px;
        }
        
        .log-entry .message {
            flex: 1;
            color: rgba(0, 255, 65, 0.7);
            word-break: break-all;
        }
        
        .log-entry.success .message { color: #00ff41; }
        .log-entry.error .message { color: #ff4444; }
        .log-entry.info .message { color: #4a9eff; }
        .log-entry.warning .message { color: #ffcc00; }
        
        /* ===== Saved State Notice ===== */
        .saved-state-notice {
            background: rgba(255, 200, 0, 0.05);
            border: 1px solid rgba(255, 200, 0, 0.2);
            border-radius: 4px;
            padding: 15px 20px;
            margin: 10px 0 20px 0;
            display: none;
        }
        
        .saved-state-notice.show {
            display: block;
        }
        
        .saved-state-notice .title {
            color: #ffcc00;
            font-size: 14px;
            letter-spacing: 1px;
        }
        
        .saved-state-notice .info {
            color: rgba(255, 200, 0, 0.6);
            font-size: 12px;
            margin: 8px 0 12px 0;
        }
        
        .saved-state-notice .actions {
            display: flex;
            gap: 10px;
        }
        
        .saved-state-notice .actions .btn {
            padding: 6px 18px;
            font-size: 12px;
            flex: 0 0 auto;
        }
        
        /* ===== Responsive ===== */
        @media (max-width: 1024px) {
            .input-section {
                grid-template-columns: 1fr 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .button-group {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .main-content { padding: 20px; }
            .header { padding: 20px; }
            .header h1 { font-size: 1.8em; margin-left: 20px; }
            .header::before { left: 10px; top: 25px; font-size: 18px; }
            
            .input-section {
                grid-template-columns: 1fr;
                padding: 15px;
            }
            .button-group {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .stat-card .value { font-size: 20px; }
            .logs-container { max-height: 250px; }
        }
        
        @media (max-width: 480px) {
            body { padding: 10px; }
            .header h1 { font-size: 1.3em; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .stat-card { padding: 10px; }
            .stat-card .value { font-size: 16px; }
        }
        
        /* ===== Animations ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .log-entry {
            animation: fadeIn 0.3s ease;
        }
        
        /* Glitch effect on header */
        .glitch {
            position: relative;
        }
        
        .glitch::after {
            content: '🔓 ClashX24 Terminal v2.0';
            position: absolute;
            left: 2px;
            top: 2px;
            color: rgba(0, 255, 65, 0.1);
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="glitch">
                <span class="blink">▶</span> CLASHX24 <span style="color: rgba(0,255,65,0.3);">//</span> BRUTE FORCE
            </h1>
            <div class="subtitle">
                <span class="status-dot online"></span>
                TERMINAL v2.0 :: <span id="connectionStatus">CONNECTED</span>
            </div>
        </div>
        
        <div class="main-content">
            <!-- Saved State Notice -->
            <div id="savedStateNotice" class="saved-state-notice">
                <div class="title">⚠️ [SAVED STATE DETECTED]</div>
                <div class="info" id="savedStateInfo">Previous session found. Resume or start fresh.</div>
                <div class="actions">
                    <button class="btn btn-success" id="resumeBtn">↻ RESUME</button>
                    <button class="btn btn-danger" id="clearStateBtn">✕ CLEAR STATE</button>
                </div>
            </div>
            
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-group">
                    <label><span class="prompt">$</span> TARGET_PHONE</label>
                    <input type="text" id="phoneNumber" placeholder="Enter 10-digit number..." maxlength="10">
                </div>
                <div class="input-group">
                    <label><span class="prompt">$</span> WORKERS</label>
                    <input type="number" id="maxWorkers" value="10" min="1" max="50">
                </div>
                <div class="input-group">
                    <label><span class="prompt">$</span> STATUS</label>
                    <div style="padding: 12px 15px; color: rgba(0,255,65,0.3); font-size: 14px;" id="statusBadge2">IDLE</div>
                </div>
            </div>
            
            <!-- Buttons -->
            <div class="button-group">
                <button class="btn btn-primary" id="sendOtpBtn">📡 SEND OTP</button>
                <button class="btn btn-success" id="startBruteforceBtn">⚡ START ATTACK</button>
                <button class="btn btn-danger" id="stopBruteforceBtn" disabled>⏹ STOP</button>
                <button class="btn btn-warning" id="clearLogsBtn">🗑 CLEAR</button>
            </div>
            
            <!-- Status Message -->
            <div id="statusMessage" class="status-message"></div>
            
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card info">
                    <div class="value" id="attemptsCount">0</div>
                    <div class="label">Attempts</div>
                </div>
                <div class="stat-card warning">
                    <div class="value" id="progressPercent">0%</div>
                    <div class="label">Progress</div>
                </div>
                <div class="stat-card success">
                    <div class="value" id="speedCount">0</div>
                    <div class="label">OTP/s</div>
                </div>
                <div class="stat-card purple">
                    <div class="value" id="foundOtp">-</div>
                    <div class="label">Found OTP</div>
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="fill" id="progressFill"></div>
                    <div class="glow"></div>
                </div>
                <div class="progress-info">
                    <span id="lastOtpTried">Last: -</span>
                    <span id="timeElapsed">⏱ 0s</span>
                    <span id="stateIndicator"></span>
                </div>
            </div>
            
            <!-- Logs -->
            <div class="logs-header">
                <h3>⬇ [LOG_STREAM]</h3>
                <span class="log-meta" id="logCount">0 entries</span>
            </div>
            <div class="logs-container" id="logsContainer">
                <div class="log-entry info">
                    <span class="timestamp">[SYS]</span>
                    <span class="message">Initializing terminal...</span>
                </div>
                <div class="log-entry info">
                    <span class="timestamp">[SYS]</span>
                    <span class="message">Ready for operation.</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== JAVASCRIPT =====
        let eventSource = null;
        let statusInterval = null;
        let isInitialLoad = true;
        
        function showMessage(message, type = 'info') {
            const msgDiv = document.getElementById('statusMessage');
            msgDiv.textContent = message;
            msgDiv.className = 'status-message show ' + type;
            
            setTimeout(() => {
                msgDiv.className = 'status-message';
            }, 5000);
        }
        
        function updateStatus(data) {
            document.getElementById('attemptsCount').textContent = data.total_attempts || 0;
            document.getElementById('progressPercent').textContent = data.progress_percentage ? data.progress_percentage.toFixed(2) + '%' : '0%';
            document.getElementById('progressFill').style.width = data.progress_percentage ? data.progress_percentage + '%' : '0%';
            document.getElementById('speedCount').textContent = data.speed ? data.speed.toFixed(1) : '0';
            document.getElementById('timeElapsed').textContent = '⏱ ' + (data.elapsed_time ? Math.floor(data.elapsed_time) + 's' : '0s');
            document.getElementById('foundOtp').textContent = data.found_otp || '-';
            document.getElementById('lastOtpTried').textContent = 'Last: ' + (data.last_otp_tried || '-');
            
            // Status badge
            const statusBadge = document.getElementById('statusBadge2');
            if (data.is_running) {
                statusBadge.textContent = '● RUNNING';
                statusBadge.style.color = '#00ff41';
            } else if (data.found_otp) {
                statusBadge.textContent = '✔ COMPLETED';
                statusBadge.style.color = '#00ff41';
            } else if (data.has_saved_state) {
                statusBadge.textContent = '⏸ SAVED';
                statusBadge.style.color = '#ffcc00';
            } else {
                statusBadge.textContent = '○ IDLE';
                statusBadge.style.color = 'rgba(0,255,65,0.3)';
            }
            
            // State indicator
            const stateIndicator = document.getElementById('stateIndicator');
            if (data.has_saved_state) {
                stateIndicator.textContent = '💾 State saved';
                stateIndicator.style.color = '#ffcc00';
            } else {
                stateIndicator.textContent = '';
            }
            
            // Saved state notice
            const savedNotice = document.getElementById('savedStateNotice');
            if (data.has_saved_state && !data.is_running && !data.completed && !data.found_otp) {
                savedNotice.classList.add('show');
                document.getElementById('savedStateInfo').textContent = 
                    `Phone: ${data.phone_number || 'Unknown'} | Attempts: ${data.total_attempts} | Last OTP: ${data.last_otp_tried || 'None'}`;
            } else {
                savedNotice.classList.remove('show');
            }
            
            // Buttons
            document.getElementById('startBruteforceBtn').disabled = data.is_running;
            document.getElementById('stopBruteforceBtn').disabled = !data.is_running;
            
            // Phone number
            if (data.phone_number && isInitialLoad) {
                document.getElementById('phoneNumber').value = data.phone_number;
                isInitialLoad = false;
            }
        }
        
        function fetchStatus() {
            fetch('/status')
                .then(res => res.json())
                .then(data => updateStatus(data))
                .catch(err => console.error('Status fetch error:', err));
        }
        
        function setupLogStream() {
            if (eventSource) {
                eventSource.close();
            }
            
            eventSource = new EventSource('/stream-logs');
            
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'heartbeat') return;
                addLogToUI(data);
            };
            
            eventSource.onerror = function() {
                console.error('Log stream error, reconnecting...');
                setTimeout(setupLogStream, 3000);
            };
        }
        
        function addLogToUI(log) {
            const container = document.getElementById('logsContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${log.status || 'info'}`;
            entry.innerHTML = `
                <span class="timestamp">[${log.timestamp || 'SYS'}]</span>
                <span class="message">${log.message}</span>
            `;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            document.getElementById('logCount').textContent = container.children.length + ' entries';
            
            // Keep max 500 logs in DOM
            if (container.children.length > 500) {
                container.removeChild(container.children[0]);
            }
        }
        
        // ===== Event Listeners =====
        
        // Resume
        document.getElementById('resumeBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const maxWorkers = parseInt(document.getElementById('maxWorkers').value) || 10;
            
            if (!phoneNumber) {
                showMessage('Enter phone number first', 'error');
                return;
            }
            
            document.getElementById('savedStateNotice').classList.remove('show');
            
            fetch('/start-bruteforce', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phone_number: phoneNumber,
                    max_workers: maxWorkers,
                    resume: true
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage(`↻ Resuming from OTP ${data.start_from || 0}...`, 'success');
                } else {
                    showMessage('✕ Resume failed: ' + data.message, 'error');
                }
            })
            .catch(err => showMessage('✕ Error: ' + err.message, 'error'));
        });
        
        // Clear State
        document.getElementById('clearStateBtn').addEventListener('click', function() {
            if (!confirm('Clear saved state? This will reset all progress.')) return;
            
            fetch('/reset-state', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('savedStateNotice').classList.remove('show');
                    showMessage('✓ State cleared', 'success');
                    fetchStatus();
                }
            })
            .catch(err => showMessage('✕ Error: ' + err.message, 'error'));
        });
        
        // Send OTP
        document.getElementById('sendOtpBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            
            if (!phoneNumber || phoneNumber.length !== 10 || !/^\d+$/.test(phoneNumber)) {
                showMessage('✕ Invalid phone number', 'error');
                return;
            }
            
            this.disabled = true;
            this.textContent = 'SENDING...';
            
            fetch('/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone_number: phoneNumber})
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('✓ OTP sent successfully!', 'success');
                } else {
                    showMessage('✕ Failed to send OTP', 'error');
                }
            })
            .catch(err => showMessage('✕ Error: ' + err.message, 'error'))
            .finally(() => {
                this.disabled = false;
                this.textContent = '📡 SEND OTP';
            });
        });
        
        // Start Brute Force
        document.getElementById('startBruteforceBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const maxWorkers = parseInt(document.getElementById('maxWorkers').value) || 10;
            
            if (!phoneNumber || phoneNumber.length !== 10 || !/^\d+$/.test(phoneNumber)) {
                showMessage('✕ Invalid phone number', 'error');
                return;
            }
            
            this.disabled = true;
            this.textContent = 'INITIALIZING...';
            
            fetch('/start-bruteforce', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phone_number: phoneNumber,
                    max_workers: maxWorkers,
                    resume: false
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('⚡ Attack started! Monitoring...', 'success');
                } else {
                    showMessage('✕ Failed: ' + data.message, 'error');
                }
            })
            .catch(err => showMessage('✕ Error: ' + err.message, 'error'))
            .finally(() => {
                this.disabled = false;
                this.textContent = '⚡ START ATTACK';
            });
        });
        
        // Stop
        document.getElementById('stopBruteforceBtn').addEventListener('click', function() {
            if (!confirm('Stop attack?')) return;
            
            this.disabled = true;
            this.textContent = 'STOPPING...';
            
            fetch('/stop-bruteforce', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('⏹ Stop signal sent', 'warning');
                }
            })
            .catch(err => showMessage('✕ Error: ' + err.message, 'error'))
            .finally(() => {
                this.disabled = false;
                this.textContent = '⏹ STOP';
            });
        });
        
        // Clear Logs
        document.getElementById('clearLogsBtn').addEventListener('click', function() {
            const container = document.getElementById('logsContainer');
            container.innerHTML = `
                <div class="log-entry info">
                    <span class="timestamp">[SYS]</span>
                    <span class="message">Logs cleared.</span>
                </div>
            `;
            document.getElementById('logCount').textContent = '1 entries';
            showMessage('✓ Logs cleared', 'info');
        });
        
        // Enter key
        document.getElementById('phoneNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('sendOtpBtn').click();
            }
        });
        
        // ===== Init =====
        setupLogStream();
        statusInterval = setInterval(fetchStatus, 2000);
        fetchStatus();
        
        console.log('🔓 ClashX24 Terminal initialized');
        console.log('📡 Status updates every 2s');
        console.log('💾 State persistence enabled');
    </script>
</body>
</html>
