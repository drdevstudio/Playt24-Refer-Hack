<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClashX24 Brute Force Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .main-content {
            padding: 30px;
        }
        
        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .input-group label {
            font-weight: 600;
            color: #333;
        }
        
        .input-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }
        
        .btn-danger {
            background: #fc8181;
            color: white;
        }
        
        .btn-danger:hover {
            background: #f56565;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 129, 129, 0.4);
        }
        
        .btn-warning {
            background: #f6ad55;
            color: white;
        }
        
        .btn-warning:hover {
            background: #ed8936;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(246, 173, 85, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: #f7fafc;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #2d3748;
        }
        
        .stat-card .label {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-card.success .value {
            color: #48bb78;
        }
        
        .stat-card.danger .value {
            color: #fc8181;
        }
        
        .stat-card.warning .value {
            color: #f6ad55;
        }
        
        .stat-card.info .value {
            color: #667eea;
        }
        
        .logs-container {
            background: #1a202c;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .logs-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .logs-container::-webkit-scrollbar-track {
            background: #2d3748;
            border-radius: 10px;
        }
        
        .logs-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        
        .log-entry {
            color: #e2e8f0;
            padding: 5px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border-bottom: 1px solid #2d3748;
            display: flex;
            gap: 10px;
        }
        
        .log-entry .timestamp {
            color: #718096;
            min-width: 70px;
        }
        
        .log-entry .message {
            flex: 1;
        }
        
        .log-entry.success .message {
            color: #48bb78;
        }
        
        .log-entry.error .message {
            color: #fc8181;
        }
        
        .log-entry.info .message {
            color: #63b3ed;
        }
        
        .log-entry.warning .message {
            color: #f6ad55;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-badge.running {
            background: #48bb78;
            color: white;
        }
        
        .status-badge.stopped {
            background: #fc8181;
            color: white;
        }
        
        .status-badge.idle {
            background: #a0aec0;
            color: white;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s;
            width: 0%;
        }
        
        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 ClashX24 Brute Force Tool</h1>
            <p>Automated OTP brute force with real-time monitoring</p>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <div class="input-group">
                    <label>📱 Phone Number</label>
                    <input type="text" id="phoneNumber" placeholder="Enter 10-digit phone number" maxlength="10">
                </div>
                <div class="input-group">
                    <label>⚡ Workers</label>
                    <input type="number" id="maxWorkers" value="10" min="1" max="50">
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" id="sendOtpBtn">📤 Send OTP</button>
                <button class="btn btn-success" id="startBruteforceBtn">🚀 Start Brute Force</button>
                <button class="btn btn-danger" id="stopBruteforceBtn" disabled>⏹️ Stop</button>
                <button class="btn btn-warning" id="clearLogsBtn">🗑️ Clear Logs</button>
            </div>
            
            <div id="statusMessage" style="margin: 15px 0; padding: 10px; border-radius: 10px; display: none;"></div>
            
            <div class="stats-grid">
                <div class="stat-card info">
                    <div class="value" id="statusBadge">Idle</div>
                    <div class="label">Status</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="attemptsCount">0</div>
                    <div class="label">Attempts</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="progressPercent">0%</div>
                    <div class="label">Progress</div>
                </div>
                <div class="stat-card success">
                    <div class="value" id="speedCount">0</div>
                    <div class="label">OTP/s</div>
                </div>
                <div class="stat-card warning">
                    <div class="value" id="timeElapsed">0s</div>
                    <div class="label">Elapsed Time</div>
                </div>
                <div class="stat-card success">
                    <div class="value" id="foundOtp">-</div>
                    <div class="label">Found OTP</div>
                </div>
            </div>
            
            <div class="progress-bar">
                <div class="fill" id="progressFill"></div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
                <h3 style="color: #2d3748;">📋 Live Logs</h3>
                <span id="logCount" style="color: #718096;">0 entries</span>
            </div>
            <div class="logs-container" id="logsContainer">
                <div class="log-entry info">
                    <span class="timestamp">System</span>
                    <span class="message">Waiting to start...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let statusInterval = null;
        
        function showMessage(message, type = 'info') {
            const msgDiv = document.getElementById('statusMessage');
            msgDiv.style.display = 'block';
            msgDiv.textContent = message;
            msgDiv.style.background = type === 'success' ? '#c6f6d5' : 
                                     type === 'error' ? '#fed7d7' : 
                                     type === 'warning' ? '#feebc8' : '#bee3f8';
            msgDiv.style.color = type === 'success' ? '#22543d' : 
                                type === 'error' ? '#9b2c2c' : 
                                type === 'warning' ? '#744210' : '#2a4365';
            
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }
        
        function updateStatus(data) {
            document.getElementById('attemptsCount').textContent = data.total_attempts || 0;
            document.getElementById('progressPercent').textContent = data.progress_percentage ? data.progress_percentage.toFixed(2) + '%' : '0%';
            document.getElementById('progressFill').style.width = data.progress_percentage ? data.progress_percentage + '%' : '0%';
            document.getElementById('speedCount').textContent = data.speed ? data.speed.toFixed(1) : '0';
            document.getElementById('timeElapsed').textContent = data.elapsed_time ? Math.floor(data.elapsed_time) + 's' : '0s';
            document.getElementById('foundOtp').textContent = data.found_otp || '-';
            
            const statusBadge = document.getElementById('statusBadge');
            if (data.is_running) {
                statusBadge.textContent = '🔴 Running';
                statusBadge.style.color = '#48bb78';
            } else if (data.found_otp) {
                statusBadge.textContent = '✅ Completed';
                statusBadge.style.color = '#48bb78';
            } else {
                statusBadge.textContent = '⏸️ Idle';
                statusBadge.style.color = '#a0aec0';
            }
            
            // Update button states
            document.getElementById('startBruteforceBtn').disabled = data.is_running;
            document.getElementById('stopBruteforceBtn').disabled = !data.is_running;
        }
        
        function fetchStatus() {
            fetch('/status')
                .then(res => res.json())
                .then(data => updateStatus(data))
                .catch(err => console.error('Error fetching status:', err));
        }
        
        function setupLogStream() {
            if (eventSource) {
                eventSource.close();
            }
            
            eventSource = new EventSource('/stream-logs');
            
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'heartbeat') return;
                
                addLogToUI(data);
            };
            
            eventSource.onerror = function() {
                console.error('EventSource failed, reconnecting...');
                setTimeout(setupLogStream, 5000);
            };
        }
        
        function addLogToUI(log) {
            const container = document.getElementById('logsContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${log.status || 'info'}`;
            entry.innerHTML = `
                <span class="timestamp">${log.timestamp || 'System'}</span>
                <span class="message">${log.message}</span>
            `;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            // Update log count
            document.getElementById('logCount').textContent = container.children.length + ' entries';
        }
        
        document.getElementById('sendOtpBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            
            if (!phoneNumber || phoneNumber.length !== 10 || !/^\d+$/.test(phoneNumber)) {
                showMessage('Please enter a valid 10-digit phone number', 'error');
                return;
            }
            
            this.disabled = true;
            this.textContent = 'Sending...';
            
            fetch('/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone_number: phoneNumber})
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('✅ OTP sent successfully! You can start brute force now.', 'success');
                } else {
                    showMessage('❌ Failed to send OTP: ' + data.message, 'error');
                }
            })
            .catch(err => {
                showMessage('❌ Error: ' + err.message, 'error');
            })
            .finally(() => {
                this.disabled = false;
                this.textContent = '📤 Send OTP';
            });
        });
        
        document.getElementById('startBruteforceBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const maxWorkers = parseInt(document.getElementById('maxWorkers').value) || 10;
            
            if (!phoneNumber || phoneNumber.length !== 10 || !/^\d+$/.test(phoneNumber)) {
                showMessage('Please enter a valid 10-digit phone number', 'error');
                return;
            }
            
            this.disabled = true;
            this.textContent = 'Starting...';
            
            fetch('/start-bruteforce', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phone_number: phoneNumber,
                    max_workers: maxWorkers
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('✅ Brute force started! Monitoring progress...', 'success');
                } else {
                    showMessage('❌ Failed to start: ' + data.message, 'error');
                }
            })
            .catch(err => {
                showMessage('❌ Error: ' + err.message, 'error');
            })
            .finally(() => {
                this.disabled = false;
                this.textContent = '🚀 Start Brute Force';
            });
        });
        
        document.getElementById('stopBruteforceBtn').addEventListener('click', function() {
            if (!confirm('Are you sure you want to stop the brute force?')) return;
            
            this.disabled = true;
            this.textContent = 'Stopping...';
            
            fetch('/stop-bruteforce', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('⏹️ Stop signal sent. Waiting for graceful shutdown...', 'warning');
                }
            })
            .catch(err => {
                showMessage('❌ Error: ' + err.message, 'error');
            })
            .finally(() => {
                this.disabled = false;
                this.textContent = '⏹️ Stop';
            });
        });
        
        document.getElementById('clearLogsBtn').addEventListener('click', function() {
            const container = document.getElementById('logsContainer');
            container.innerHTML = '';
            document.getElementById('logCount').textContent = '0 entries';
            showMessage('🗑️ Logs cleared', 'info');
        });
        
        // Initialize
        setupLogStream();
        statusInterval = setInterval(fetchStatus, 2000);
        fetchStatus();
        
        // Allow Enter key on phone number input
        document.getElementById('phoneNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('sendOtpBtn').click();
            }
        });
    </script>
</body>
</html>
